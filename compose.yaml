name: agencyos-client-hub
services:
  postgres:
    image: postgres:17-alpine
    container_name: agencyos-client-hub-db
    environment:
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run node scripts/setup-local.mjs first}
      POSTGRES_DB: agencyos_hub
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - client-hub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agencyos -d agencyos_hub']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  client-hub-pgdata:
